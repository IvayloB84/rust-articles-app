apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails-app-deployment
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rails-web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: rails-web
    spec:
      containers:
      - name: rust-container
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        env:
        - name: RUST_LOG
          value: {{ .Values.rust.logLevel | default "info" | quote }}
        - name: DATABASE_URL
          value: "sqlite:///app/storage/production.sqlite3?mode=rwc"
        ports:
        - containerPort: 3000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /rails/articles
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /app/storage
          name: sqlite-storage
      initContainers:
      - name: volume-permissions-fix
        image: alpine:3.24
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "chown -R 1000:1000 /app/storage && chmod -R 775 /app/storage"]
        volumeMounts:
        - mountPath: /app/storage
          name: sqlite-storage
      volumes:
      - name: sqlite-storage
        persistentVolumeClaim:
          claimName: rails-sqlite-pvc