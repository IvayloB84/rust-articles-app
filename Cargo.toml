[package]
name = "rust-articles-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
